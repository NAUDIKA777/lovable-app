name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "android-shell/**"
      - "capacitor.config.ts"
      - ".github/workflows/android-debug.yml"

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Set under Settings > Secrets and variables > Actions > Variables.
      # The published site address, https only, e.g. https://your-site.lovable.app
      CAP_SERVER_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Require SITE_URL
        run: |
          case "$CAP_SERVER_URL" in
            https://*) ;;
            *) echo "::error::Add a repository variable named SITE_URL set to your published https:// site address."; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # Writes capacitor.config.json (including the site address) into the Android project.
      - name: Capacitor sync
        run: bunx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: strutworthy-scanner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
